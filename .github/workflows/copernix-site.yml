name: Copernix site

# Checks every change to the site; deploys to Cloudflare only from main (ADR 0011).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "landing/**"
      - "frontend/**"
      - "contracts/**"
      - "scripts/build-landing.mjs"
      - "scripts/check-landing.mjs"
      - "deploy/**"
      - "wrangler.jsonc"
      - ".github/workflows/copernix-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copernix-site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Tests
        # navigation.test.ts (TAN drag) is flaky upstream; retry instead of failing the deploy on noise
        run: pnpm --dir frontend exec vitest run --retry=2
      - name: Build the viewer
        run: pnpm --dir frontend build:copernix
      - name: Package the static site
        run: node scripts/build-landing.mjs
      - name: Check the landing and the package
        # after packaging: it also fails when a file the landing imports is missing from dist/landing
        run: node scripts/check-landing.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: copernix-static
          path: dist/landing
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://demo.copernix.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copernix-static
          path: dist/landing
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.162.0
          command: deploy
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          base=https://demo.copernix.workers.dev
          for path in / /viewer/ /demo/manifest.json /assets/spherex-views/manifest.json /model/spherex.gltf; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          # /api/v1 goes through the Worker to the backend. The backend is another team's server, so a 502 (backend
          # down) must not block a deploy of the site; a 404 would mean the proxy route itself is missing.
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 3 "$base/api/v1/health")
          echo "/api/v1/health -> $code"
          [ "$code" = "200" ] || [ "$code" = "502" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/v1/health")
          echo "POST /api/v1/health -> $code"
          [ "$code" = "405" ]
