<!doctype html><meta charset="utf-8"><title>render</title>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search),YAW=+q.get('yaw'),PITCH=q.get('pitch').split(',').map(Number),SIZE=+q.get('size');
const post=(path,body)=>fetch(path,{method:'POST',body});
const canvas=document.createElement('canvas');document.body.append(canvas);

const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info'),name=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'?';

renderer.setPixelRatio(1);renderer.setSize(SIZE,SIZE,false);renderer.setClearColor(0x000000,0);

const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.55;
const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(-6,7,9);scene.add(sun);

const base=new THREE.Quaternion().setFromEuler(new THREE.Euler(.38,-.95,.12));

model.position.sub(c);holder.add(model);
const worldH=2*Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.position.z;
holder.scale.setScalar(.9*worldH/(2*radius));          // the bounding sphere fills 90 % of the frame, as in the page
const AX=new THREE.Vector3(1,0,0),AY=new THREE.Vector3(0,1,0),qx=new THREE.Quaternion(),qy=new THREE.Quaternion();
for(let p=0;p<PITCH.length;p++)for(let y=0;y<YAW;y++){
  qy.setFromAxisAngle(AY,y*2*Math.PI/YAW);qx.setFromAxisAngle(AX,THREE.MathUtils.degToRad(PITCH[p]));

  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  await post(`/save?name=${p}-${String(y).padStart(2,'0')}`,blob);
}

</script>
