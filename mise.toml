# Single entry point for tools and tasks on Fedora and Windows.
# Install mise once (docs/context/08-entorno-y-comandos.md), then:
#   mise trust && mise install && mise run setup
# Rules: tasks are arrays of single commands (Windows runs them with `cmd /c`):
# no `&&`, pipes or $VARS. Any logic goes in a Python script under scripts/.

[tools]
uv = "0.13.8"
node = "24.22.3"
pnpm = "12.18.0"
lefthook = "2.2.2"

[env]
PYTHONUTF8 = "1"
UV_LINK_MODE = "copy"

[tasks.setup]
description = "Prepare the repo after cloning (idempotent)"
run = ["uv run --no-project python scripts/sync_skills.py"]

[tasks.sync-skills]
description = "Copy .agents/skills -> .claude/skills (Claude Code)"
run = "uv run --no-project python scripts/sync_skills.py"

[tasks.check-skills]
description = "Fail if .claude/skills is out of sync"
run = "uv run --no-project python scripts/sync_skills.py --check"

# Added when the stack is approved and frontend/ + backend/ exist (see docs/context/08):
# dev, dev:api, dev:web, test, lint, fmt, build, gen-api, precompute

[tasks.grid-spherex]
description = "Generate the reproducible SPHEREx DR1 sky grid"
run = "uv run --locked --script scripts/generate-spherex-grid.py --output spherex-grid"

[tasks.grid-test]
description = "Test SPHEREx grid generation"
run = "uv run --python 3.13 --with astropy==8.0.2 --with astropy-healpix==1.1.3 --with numpy==2.5.4 --with hpgeom==1.7.1 python -m unittest discover -s tests -p test_spherex_grid.py"

# Backend (backend/, FastAPI + uv). See backend/AGENTS.md.
[tasks.api-dev]
description = "Run the API locally with reload on http://127.0.0.1:8000"
run = "uv run --directory backend uvicorn --factory skyshift.api.app:create_app --reload --host 127.0.0.1 --port 8000"

[tasks.api-test]
description = "Backend tests (unit, contract, architecture)"
run = "uv run --directory backend pytest"

[tasks.api-lint]
description = "Backend lint, format check and strict typing"
run = ["uv run --directory backend ruff check .", "uv run --directory backend ruff format --check .", "uv run --directory backend pyright"]
